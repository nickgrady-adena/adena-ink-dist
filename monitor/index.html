<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adena Monitor</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="signin" class="signin hidden">
  <div class="signin-card">
    <img src="logo.png" alt="Adena Warriors">
    <h1 id="signin-title">Adena Monitor</h1>
    <p>Sign in with your Adena school Google account.</p>
    <button id="signin-btn" class="btn primary big">Sign in with Google</button>
    <p id="signin-err" class="err"></p>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="rail">
    <a class="brand" id="brand" href="#">
      <img src="logo.png" alt="">
      <span><strong id="brand-name">Adena Monitor</strong><small id="brand-school">Adena Local Schools</small></span>
    </a>
    <nav id="nav"></nav>
    <div class="rail-foot">
      <div class="who"><span id="me-name"></span><span id="me-role" class="role-chip"></span></div>
      <button id="signout" class="linkish">Sign out</button>
    </div>
  </aside>
  <div class="stage">
    <header class="topbar">
      <div class="search">
        <input id="search" type="search" placeholder="Find a student by name or email" autocomplete="off">
        <div id="search-results" class="search-results hidden"></div>
      </div>
      <button id="bell" class="bell" aria-label="Tamper alerts"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg><span id="bell-count" class="bell-count hidden">0</span></button>
      <div id="bell-panel" class="bell-panel hidden"></div>
    </header>
    <main id="main" class="main"></main>
  </div>
</div>

<div id="drawer" class="drawer hidden" role="dialog" aria-modal="true"></div>
<div id="modal" class="modal hidden"><div class="modal-card" id="modal-card" role="dialog" aria-modal="true"></div></div>
<div id="toasts" class="toasts"></div>

<script type="module" src="app.js"></script>
</body>
</html>
